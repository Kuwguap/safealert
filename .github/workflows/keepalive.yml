name: Keep Supabase awake

# Supabase free-tier projects pause after ~1 week of inactivity, which takes
# the SafeAlert backend down. This pings the REST API daily so it stays active.
on:
  schedule:
    - cron: '17 6 * * *' # every day at 06:17 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping SafeAlert backend
        run: |
          curl -s -o /dev/null -w "status %{http_code}\n" \
            -H "apikey: sb_publishable_rMz6Dp7xX9cYlz9x9ax79A_8OcwC4fY" \
            "https://vzrabcnknbycmdbmvdso.supabase.co/rest/v1/safealert_bulletins?select=id&limit=1"
